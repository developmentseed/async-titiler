<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>TiTiler Map Viewer</title>
    <meta
      name="viewport"
      content="initial-scale=1,maximum-scale=1,user-scalable=no"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css"
    />
    <style>
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #e5e5e5;
      }
      #map {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 100%;
      }
      .fixed-bottom {
          position: absolute;
          left: 0;
          bottom: 0;
          z-index: 1000;
      }
      .info-panel {
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 1000;
        background: rgba(255, 255, 255, 0.9);
        padding: 8px 12px;
        border-radius: 4px;
        font-family: sans-serif;
        font-size: 12px;
        max-width: 280px;
      }
      .info-panel p {
        margin: 2px 0;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div class="info-panel" id="info-panel">
      <p>
        <label>
          <input type="radio" name="display-mode" value="gray" checked />
          Single band
        </label>
        <label>
          <input type="radio" name="display-mode" value="rgb" />
          RGB combination
        </label>
      </p>
      <div id="gray-controls">
        <label for="band-select"><strong>Band:</strong></label>
        <select id="band-select"></select>
      </div>
      <div id="rgb-controls" style="display: none;">
        <label for="band-select-r"><strong>R:</strong></label>
        <select id="band-select-r"></select>
        <label for="band-select-g"><strong>G:</strong></label>
        <select id="band-select-g"></select>
        <label for="band-select-b"><strong>B:</strong></label>
        <select id="band-select-b"></select>
      </div>
      <p id="status">Loading tiles…</p>
    </div>

    <script type="module">
      import maplibregl from "https://esm.sh/maplibre-gl@4";
      import { MapboxOverlay } from "https://esm.sh/@deck.gl/mapbox@9?bundle-deps&external=maplibre-gl";
      import {
        RasterTileLayer,
        TileMatrixSetAdaptor,
      } from "https://esm.sh/@developmentseed/deck.gl-raster@0.8.0-beta.2?bundle-deps";
      import { CreateTexture } from "https://esm.sh/@developmentseed/deck.gl-raster@0.8.0-beta.2/gpu-modules?bundle-deps";
      import proj4 from "https://esm.sh/proj4@2";
      import NpyJs from "https://esm.sh/npyjs@0.6";

      const npyParser = new NpyJs();
      const status = document.getElementById("status");

      // TMS + native-CRS <-> geographic/mercator conversion. The tiles are
      // served in the dataset's own (native) CRS, not EPSG:3857, so both
      // to/from 3857 and to/from 4326 proj4 conversions go through 4326.
      const nativeProj4 = {{ tms.crs.to_proj4()|tojson }};
      const toGeographic = proj4(nativeProj4, "EPSG:4326");
      const to3857 = proj4("EPSG:4326", "EPSG:3857");

      const projectTo4326 = (x, y) => toGeographic.forward([x, y]);
      const projectFrom4326 = (x, y) => toGeographic.inverse([x, y]);
      const projectTo3857 = (x, y) => to3857.forward(projectTo4326(x, y));
      const projectFrom3857 = (x, y) => {
        const [lon, lat] = to3857.inverse([x, y]);
        return projectFrom4326(lon, lat);
      };

      const tms = {{ tms.model_dump(exclude_none=True, mode="json")|tojson }};
      const xyBbox = {{ [tms.xy_bbox.left, tms.xy_bbox.bottom, tms.xy_bbox.right, tms.xy_bbox.top]|tojson }};
      const [left, bottom, right, top] = xyBbox;
      tms.boundingBox = {
        lowerLeft: [left, bottom],
        upperRight: [right, top],
        crs: tms.crs,
      };

      const descriptor = new TileMatrixSetAdaptor(tms, {
        projectTo3857,
        projectFrom3857,
        projectTo4326,
        projectFrom4326,
      });

      const dtype_ranges = {
        'int8': [-128, 127],
        'uint8': [0, 255],
        'uint16': [0, 65535],
        'int16': [-32768, 32767],
        'uint32': [0, 4294967295],
        'int32': [-2147483648, 2147483647],
        'float16': [-6.55040e+04, 6.55040e+04],
        'float32': [-3.4028235e+38, 3.4028235e+38],
        'float64': [-1.7976931348623157e+308, 1.7976931348623157e+308],
        'int64': [-9223372036854775808, 9223372036854775807],
        'uint64': [0, 18446744073709551615],
      }

      const tilesUrlTemplate = {{ tiles_url|tojson }};
      const statistics = {{ statistics|tojson }};
      const dataType = {{ info.dtype|tojson }};
      const defaultRange = dtype_ranges[dataType] || [0, 255];

      // `statistics` is keyed by rio-tiler band name (e.g. "b1", "b2", ...)
      // in band order — that order gives us the (1-based) `bidx` the tile
      // endpoint expects. Fall back to a single unnamed band if the reader
      // reported none.
      const statNames = Object.keys(statistics || {});
      const bandList = statNames.length
        ? statNames.map((name, i) => [
            i + 1,
            statistics[name].description || name,
            name,
          ])
        : [[1, "band 1", "b1"]];

      function rangeForBand(bandIdx) {
        const entry = bandList[bandIdx - 1];
        const name = entry ? entry[2] : undefined;
        const stats = statistics && name ? statistics[name] : undefined;
        const [bandMin, bandMax] = stats ? [stats.min, stats.max] : defaultRange;
        return { bandMin, bandMax, range: bandMax - bandMin || 1 };
      }

      // `bandIdxList` is an array of 1-based band indices; the tile
      // endpoint accepts repeated `bidx` params to select/reorder bands
      // (single entry for grayscale, three for an RGB combination).
      function tileUrl(z, x, y, bandIdxList) {
        const url = tilesUrlTemplate
          .replace("{z}", z)
          .replace("{x}", x)
          .replace("{y}", y);
        const sep = url.includes("?") ? "&" : "?";
        const bidx = bandIdxList.map((b) => `bidx=${b}`).join("&");
        return `${url}${sep}${bidx}`;
      }

      // Stretch each requested band's raw values linearly into uint8 using
      // its own min/max, packed into an interleaved RGBA buffer (A=255).
      // With a single band, the value is replicated across R/G/B — a
      // single-channel r8unorm texture would sample as (r, 0, 0, 1), i.e.
      // render red instead of grayscale, so we always pack RGBA.
      function stretchToRGBA(data, height, width, bandRanges) {
        const pixelCount = height * width;
        const out = new Uint8Array(pixelCount * 4);
        const planes =
          bandRanges.length === 1
            ? [0, 0, 0]
            : [0, 1, 2];
        for (let i = 0; i < pixelCount; i++) {
          for (let c = 0; c < 3; c++) {
            const plane = planes[c];
            const { bandMin, range } = bandRanges[plane];
            const raw = data[plane * pixelCount + i];
            const v = ((raw - bandMin) / range) * 255;
            out[i * 4 + c] = Math.max(0, Math.min(255, v));
          }
          out[i * 4 + 3] = 255;
        }
        return out;
      }

      function makeGetTileData(bandIdxList) {
        const bandRanges = bandIdxList.map(rangeForBand);
        return async function getTileData(tile, options) {
          const { device, signal } = options;
          const { x, y, z } = tile.index;
          const response = await fetch(tileUrl(z, x, y, bandIdxList), { signal });
          if (!response.ok) {
            throw new Error(
              `tile ${z}/${x}/${y} ${response.status}: ${await response.text()}`,
            );
          }
          const buffer = await response.arrayBuffer();
          const parsed = npyParser.parse(buffer);
          if (parsed.shape.length !== 3) {
            throw new Error(
              `Expected shape [B, H, W], got [${parsed.shape.join(", ")}]`,
            );
          }
          const [, height, width] = parsed.shape;
          const rgba = stretchToRGBA(parsed.data, height, width, bandRanges);
          const texture = device.createTexture({
            data: rgba,
            format: "rgba8unorm",
            width,
            height,
            sampler: { minFilter: "linear", magFilter: "linear" },
          });
          return { width, height, byteLength: rgba.byteLength, texture };
        };
      }

      function renderTile(data) {
        return {
          renderPipeline: [
            { module: CreateTexture, props: { textureName: data.texture } },
          ],
        };
      }

      const bounds = {{ bounds|tojson }};

      const map = new maplibregl.Map({
        container: "map",
        style: "https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json",
        bounds: [
          [bounds[0], bounds[1]],
          [bounds[2], bounds[3]],
        ],
        fitBoundsOptions: { padding: 40 },
      });

      function populateBandSelect(select, defaultIdx) {
        for (const [idx, description] of bandList) {
          const option = document.createElement("option");
          option.value = idx;
          option.textContent = description || `band ${idx}`;
          if (idx === defaultIdx) {
            option.selected = true;
          }
          select.appendChild(option);
        }
      }

      const bandSelect = document.getElementById("band-select");
      const bandSelectR = document.getElementById("band-select-r");
      const bandSelectG = document.getElementById("band-select-g");
      const bandSelectB = document.getElementById("band-select-b");
      const grayControls = document.getElementById("gray-controls");
      const rgbControls = document.getElementById("rgb-controls");

      // Default RGB pick: first three bands, repeating the last one if the
      // dataset has fewer than three.
      const rgbDefaults = [
        bandList[0][0],
        (bandList[1] || bandList[0])[0],
        (bandList[2] || bandList[bandList.length - 1])[0],
      ];

      populateBandSelect(bandSelect, bandList[0][0]);
      populateBandSelect(bandSelectR, rgbDefaults[0]);
      populateBandSelect(bandSelectG, rgbDefaults[1]);
      populateBandSelect(bandSelectB, rgbDefaults[2]);

      function buildLayer() {
        const mode = document.querySelector(
          'input[name="display-mode"]:checked',
        ).value;
        const bandIdxList =
          mode === "rgb"
            ? [
                Number(bandSelectR.value),
                Number(bandSelectG.value),
                Number(bandSelectB.value),
              ]
            : [Number(bandSelect.value)];

        return new RasterTileLayer({
          id: `async-titiler-raster-${mode}-${bandIdxList.join("-")}`,
          tilesetDescriptor: descriptor,
          getTileData: makeGetTileData(bandIdxList),
          renderTile,
          minZoom: {{ tms.minzoom }},
          maxZoom: {{ tms.maxzoom }},
        });
      }

      let overlay;

      map.on("load", () => {
        overlay = new MapboxOverlay({
          interleaved: true,
          layers: [buildLayer()],
        });
        map.addControl(overlay);
        status.textContent = "";
      });

      function refreshLayer() {
        if (overlay) {
          overlay.setProps({ layers: [buildLayer()] });
        }
      }

      for (const radio of document.querySelectorAll(
        'input[name="display-mode"]',
      )) {
        radio.addEventListener("change", () => {
          const mode = radio.value;
          grayControls.style.display = mode === "gray" ? "" : "none";
          rgbControls.style.display = mode === "rgb" ? "" : "none";
          if (radio.checked) {
            refreshLayer();
          }
        });
      }

      bandSelect.addEventListener("change", refreshLayer);
      bandSelectR.addEventListener("change", refreshLayer);
      bandSelectG.addEventListener("change", refreshLayer);
      bandSelectB.addEventListener("change", refreshLayer);

      map.on("error", (e) => {
        status.textContent = `Error: ${e.error?.message || "unknown"}`;
        console.error(e);
      });
    </script>
  </body>
</html>
